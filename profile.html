<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08070d"><title>Shizsociety profile</title><link rel="stylesheet" href="/style.css"></head><body><header class="top"><a class="brand" href="/"><span class="brandmark"><svg viewBox="0 0 24 24" fill="none"><path d="M17.5 5.5H9.2a4.2 4.2 0 0 0 0 8.4h5.6a2.7 2.7 0 0 1 0 5.4H6.5" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg></span> SHIZSOCIETY</a><nav class="nav"><a href="/">Explore</a><a href="/owner">Owner</a></nav></header><main class="shell"><section class="panel profileview"><div class="avatar" id="avatar">S</div><h1 id="name">Loading…</h1><div class="bio" id="handle"></div><p class="bio" id="bio"></p><div id="links"></div><button class="iconbtn hidden" id="edit"><svg viewBox="0 0 24 24" fill="none"><path d="m14 5 5 5M4 20l4.2-.8L19 8.4a2.1 2.1 0 0 0-3-3L5.2 16.2 4 20Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>Edit profile</button><div class="msg" id="msg"></div></section>
<section class="panel formpanel hidden" id="editor"><div class="formhead"><h2>Edit your profile</h2><button class="iconbtn" id="closeEdit">Close</button></div><div class="formgrid"><div class="group"><label>Display name</label><input id="display" maxlength="40"></div><div class="group"><label>Avatar image URL (HTTPS)</label><input id="avatarUrl" placeholder="https://…"></div><div class="group full"><label>Bio</label><textarea id="bioInput" maxlength="160"></textarea></div><div class="group"><label>Accent color</label><select id="accent"><option value="#a855f7">Violet</option><option value="#ec4899">Pink</option><option value="#3b82f6">Blue</option><option value="#14b8a6">Teal</option><option value="#f97316">Orange</option><option value="#e5e7eb">Silver</option></select></div><div class="group"><label>Background</label><select id="background"><option value="aurora">Aurora</option><option value="midnight">Midnight</option><option value="sunset">Sunset</option><option value="ocean">Ocean</option></select></div><div class="group"><label>Link 1 title</label><input id="t1" placeholder="Discord"></div><div class="group"><label>Link 1 URL</label><input id="u1" placeholder="https://…"></div><div class="group"><label>Link 2 title</label><input id="t2" placeholder="TikTok"></div><div class="group"><label>Link 2 URL</label><input id="u2" placeholder="https://…"></div><div class="group"><label>Link 3 title</label><input id="t3" placeholder="Website"></div><div class="group"><label>Link 3 URL</label><input id="u3" placeholder="https://…"></div></div><div class="rowactions"><button class="btn" id="save">Save changes</button></div><div class="msg" id="saveMsg"></div><div class="notice">Your private edit key is saved in this browser. Do not clear this site's data if you want to keep access to your profile editor.</div></section><footer class="footer">SHIZSOCIETY · YOUR SPACE ON THE INTERNET</footer></main>
<script>
const username=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'');const $=id=>document.getElementById(id);let token=localStorage.getItem('shizsociety_user_'+username.toLowerCase()),profile;
function note(t,c=''){ $('msg').textContent=t;$('msg').className='msg '+c}
function show(p){profile=p;$('name').textContent=p.displayName;$('handle').textContent='@'+p.username+' · '+Number(p.views).toLocaleString()+' views';$('bio').textContent=p.bio||'';$('avatar').innerHTML='';if(p.avatarUrl){const im=document.createElement('img');im.src=p.avatarUrl;im.alt='';im.onerror=()=>{$('avatar').textContent=p.username.slice(0,2).toUpperCase()};$('avatar').append(im)}else $('avatar').textContent=p.username.slice(0,2).toUpperCase();document.documentElement.style.setProperty('--accent',p.accent||'#a855f7');const bg={aurora:'radial-gradient(ellipse at 12% 5%,#3a145c88,transparent 32%),radial-gradient(ellipse at 88% 20%,#1e2b5980,transparent 30%),linear-gradient(145deg,#08070d,#0e0a17 55%,#09070f)',midnight:'radial-gradient(ellipse at 50% 0%,#33334b,transparent 45%),#080810',sunset:'radial-gradient(ellipse at 50% 0%,#7c2d4b,transparent 50%),#10080f',ocean:'radial-gradient(ellipse at 50% 0%,#164e63,transparent 50%),#061016'};document.body.style.background=bg[p.background]||bg.aurora;$('links').innerHTML='';(p.links||[]).forEach(l=>{const a=document.createElement('a');a.className='social';a.href=l.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=l.title;$('links').append(a)});if(token)$('edit').classList.remove('hidden')}
async function load(){try{const r=await fetch('/api/profile/'+encodeURIComponent(username));const p=await r.json();if(!r.ok)throw Error(p.error);show(p);if(location.search.includes('edit=1')&&token)openEditor()}catch(e){note(e.message,'err');$('name').textContent='Profile not found'}}
function openEditor(){if(!profile)return;$('editor').classList.remove('hidden');$('display').value=profile.displayName||'';$('avatarUrl').value=profile.avatarUrl||'';$('bioInput').value=profile.bio||'';$('accent').value=profile.accent||'#a855f7';$('background').value=profile.background||'aurora';for(let i=1;i<=3;i++){const l=profile.links?.[i-1]||{};$('t'+i).value=l.title||'';$('u'+i).value=l.url||''}$('editor').scrollIntoView({behavior:'smooth'})}
$('edit').onclick=openEditor;$('closeEdit').onclick=()=>$('editor').classList.add('hidden');
$('save').onclick=async()=>{const links=[];for(let i=1;i<=3;i++){const title=$('t'+i).value.trim(),url=$('u'+i).value.trim();if(title||url)links.push({title,url})}const body={displayName:$('display').value,bio:$('bioInput').value,avatarUrl:$('avatarUrl').value,accent:$('accent').value,background:$('background').value,links};try{const r=await fetch('/api/profile/'+encodeURIComponent(username),{method:'PUT',headers:{'Content-Type':'application/json','X-Edit-Token':token},body:JSON.stringify(body)});const p=await r.json();if(!r.ok)throw Error(p.error);show(p);$('saveMsg').textContent='Profile saved';$('saveMsg').className='msg ok'}catch(e){$('saveMsg').textContent=e.message;$('saveMsg').className='msg err'}};
load();
</script></body></html>
